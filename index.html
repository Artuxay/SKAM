<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>СКАМ</title>
<meta name="description" content="СКАМ — не развод, а мессенджер.">
<meta name="theme-color" content="#E9E2D5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#070708" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="СКАМ">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@800&display=swap">
<script>
  // Тема до отрисовки, чтобы не мигало.
  try { var t = localStorage.getItem('skam:theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="skamGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFAB1A"/><stop offset=".5" stop-color="#F25A1E"/><stop offset=".9" stop-color="#A8B429"/><stop offset="1" stop-color="#9CC02A"/>
    </linearGradient>
    <symbol id="skamMark" viewBox="-1 -1 131 143"><path fill-rule="evenodd" d="M9.84 98.75A64.5 64.5 0 1 1 39.9 124.1L0.5 140.5Z M34 64.5A30.5 30.5 0 1 0 95 64.5A30.5 30.5 0 1 0 34 64.5Z"/></symbol>
  </defs>
</svg>
<div id="root">
  <div class="boot" aria-busy="true" aria-label="Загрузка">
    <svg class="appicon hero" viewBox="0 0 200 200" aria-hidden="true"><rect width="200" height="200" rx="46" fill="url(#skamGrad)"/><use href="#skamMark" x="54.3" y="50.3" width="91.7" height="100.1" fill="#0E0E10"/></svg>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
