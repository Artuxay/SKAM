# Сборка и публикация СКАМ на GitHub Pages при каждом пуше в main.
# Один раз включите: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Деплой на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # base_path: «/<репозиторий>» для адреса вида https://<логин>.github.io/<репозиторий>/,
      # пустой — для своего домена.
      - id: pages
        uses: actions/configure-pages@v6

      - name: Сборка
        run: npm run build -- --base=${{ steps.pages.outputs.base_path }}/
        env:
          # Публичные ключи Supabase (они всё равно попадают в браузер). Можно переопределить
          # в Settings → Secrets and variables → Actions → Variables.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://fsqbxvufqhghiwwzplpn.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_2eHigjlaIAEiwjrgkL2xzg__mEZYBxW' }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
