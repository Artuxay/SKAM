# СКАМ живёт на своём сервере: https://skam-messenger.ru (сборку делает сервер, см. server/README.md).
# GitHub Pages теперь только перенаправляет со старого адреса https://artuxay.github.io/SKAM/
# на новый, сохраняя путь и параметры (?join=…, ?stickers=…), и снимает старый service worker.
name: Перенаправление со старого адреса

on:
  push:
    branches: [main]
    paths:
      - 'pages-redirect/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages-redirect

      - id: deployment
        uses: actions/deploy-pages@v5
