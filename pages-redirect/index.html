<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>СКАМ переехал на skam-messenger.ru</title>
<link rel="canonical" href="https://skam-messenger.ru/">
<script>
  // Старый адрес https://artuxay.github.io/SKAM/<путь>?<параметры>
  // → https://skam-messenger.ru/<путь>?<параметры> (ссылки ?join=…, ?stickers=…, документы).
  (function () {
    var path = location.pathname.replace(/^\/skam(?=\/|$)/i, '') || '/';
    if (path === '/index.html') path = '/';
    location.replace('https://skam-messenger.ru' + path + location.search);
  })();
</script>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 17px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #f4efe6; color: #0e0e10; }
  @media (prefers-color-scheme: dark) { body { background: #121214; color: #f4efe6; } a { color: #ff8a4c; } }
  main { max-width: 26rem; padding: 2rem 1.5rem; text-align: center; }
  a { color: #b5400c; font-weight: 600; }
</style>
</head>
<body>
<main>
  <p><strong>СКАМ переехал</strong> на новый адрес:<br><a href="https://skam-messenger.ru/">skam-messenger.ru</a></p>
  <p>Войдите там по почте и введите пароль шифрования, как на новом устройстве.</p>
</main>
</body>
</html>
