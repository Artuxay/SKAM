services:
  supavisor:
    ports: !override
      - "127.0.0.1:5432:5432"
      - "127.0.0.1:6543:6543"
  caddy:
    volumes:
      - /opt/skam-test/site:/srv/skam-test:ro
  auth:
    image: supabase/gotrue:v2.197.0
    environment:
      GOTRUE_MAILER_OTP_LENGTH: "8"
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "100"
      GOTRUE_SMTP_SENDER_NAME: "\u0421\u041a\u0410\u041c"
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: >-
        https://skam-messenger.ru/email/magic_link.html
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: >-
        https://skam-messenger.ru/email/confirmation.html
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: "\u041a\u043e\u0434\x20\u0434\
        \u043b\u044f\x20\u0432\u0445\u043e\u0434\u0430\x20\u0432\x20\
        \u0421\u041a\u0410\u041c\x20/\x20SKAM\x20sign-in\x20code:\x20{\
        {\x20.Token\x20}}"
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: "\u041a\u043e\u0434\x20\
        \u0434\u043b\u044f\x20\u0440\u0435\u0433\u0438\u0441\u0442\
        \u0440\u0430\u0446\u0438\u0438\x20\u0432\x20\u0421\u041a\u0410\
        \u041c\x20/\x20SKAM\x20sign-up\x20code:\x20{{\x20.Token\x20}}"
  functions:
    environment:
      SMTP_HOST: smtp.mail.selcloud.ru
      SMTP_PORT: "1127"
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: noreply@skam-messenger.ru
      SUPPORT_TO: skam.messenger@yandex.com
      OAUTH_REDIRECT_URLS: >-
        https://skam-messenger.ru/,https://test.skam-messenger.ru/
